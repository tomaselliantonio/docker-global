<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade</title>
<style>
  :root { --bg:#07080f; --fg:#e8eaf6; --mut:#8890b5; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; display:grid; place-items:center; padding:32px 16px;
    background:
      radial-gradient(60% 50% at 15% 10%, #3b1d7a55, transparent 70%),
      radial-gradient(50% 50% at 90% 90%, #0e7c8a55, transparent 70%),
      var(--bg);
    color:var(--fg); font-family:system-ui, "Segoe UI", sans-serif;
  }
  main { width:min(960px,100%); }
  h1 { font-size:clamp(2rem,6vw,3.5rem); letter-spacing:.2em; text-transform:uppercase; font-weight:800;
       background:linear-gradient(90deg,#a78bfa,#22d3ee,#f472b6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p.sub { color:var(--mut); margin:.5rem 0 2.5rem; }
  .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  a.card {
    position:relative; display:block; padding:28px 24px; border-radius:20px; text-decoration:none; color:inherit;
    background:#ffffff0a; border:1px solid #ffffff18; backdrop-filter:blur(10px);
    transition:transform .25s, border-color .25s, box-shadow .25s;
  }
  a.card:hover { transform:translateY(-6px); border-color:var(--c); box-shadow:0 12px 40px -12px var(--c); }
  .ico { font-size:3rem; line-height:1; margin-bottom:16px; }
  h2 { font-size:1.4rem; margin-bottom:6px; }
  .card p { color:var(--mut); font-size:.95rem; }
  .tag { position:absolute; top:16px; right:18px; font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:var(--c); }
</style>
</head>
<body>
<main>
  <h1>Arcade</h1>
  <p class="sub">Pausa caffè. Scegli un gioco.</p>
  <div class="grid">
    <a class="card" href="/2048/" style="--c:#f59e0b"><span class="tag">puzzle</span><div class="ico">🔢</div><h2>2048</h2><p>Unisci le tessere fino ad arrivare a 2048.</p></a>
    <a class="card" href="/hextris/" style="--c:#22d3ee"><span class="tag">reflex</span><div class="ico">⬡</div><h2>Hextris</h2><p>Tetris esagonale, ritmo e riflessi.</p></a>
    <a class="card" href="/pacman/" style="--c:#facc15"><span class="tag">classic</span><div class="ico">🟡</div><h2>Pac-Man</h2><p>Mangia i puntini, evita i fantasmi.</p></a>
  </div>
</main>
</body>
</html>
