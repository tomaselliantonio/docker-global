---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/

- greeting:
    text_size: 4xl
    text: "{{HOMEPAGE_VAR_GREETING}}"

- resources:
    cpu: true
    memory: true
    disk: /

- datetime:
    text_size: xl
    locale: it
    format:
      dateStyle: short
      timeStyle: short
      hour12: false

- search:
    provider: google
    target: _blank
