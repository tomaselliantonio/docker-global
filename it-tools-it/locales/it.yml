about:
  content: >
    # Informazioni su IT-Tools

    Questo sito, realizzato con ❤ da [Corentin Thomasset](https://corentin.tech?utm_source=it-tools&utm_medium=about), raccoglie strumenti utili per sviluppatori e per chi lavora nell'IT. Se lo trovi utile, condividilo con chi potrebbe averne bisogno e non dimenticare di salvarlo tra i preferiti!

    IT Tools è open source (licenza GPL-3.0) e gratuito, e lo resterà sempre, ma ospitarlo e rinnovare il dominio ha un costo. Se vuoi sostenere il progetto e incoraggiarmi ad aggiungere nuovi strumenti, considera di [sponsorizzarmi](https://www.buymeacoffee.com/cthmsst).

    ## Tecnologie

    IT Tools è realizzato con Vue.js (Vue 3) e la libreria di componenti Naive UI. Alcuni strumenti usano librerie open source di terze parti: l'elenco completo è nel file [package.json](https://github.com/CorentinTh/it-tools/blob/main/package.json) del repository.

    ## Hai trovato un bug? Manca uno strumento?

    Se ti serve uno strumento che non c'è e pensi possa essere utile, puoi proporlo nella [sezione issues](https://github.com/CorentinTh/it-tools/issues/new/choose) del repository GitHub.

    Se invece hai trovato un bug, o qualcosa non funziona come previsto, aprine la segnalazione nella [sezione issues](https://github.com/CorentinTh/it-tools/issues/new/choose) del repository GitHub.

