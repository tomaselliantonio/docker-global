services:
  traefik:
    image: traefik:v2.11
    container_name: traefik_global
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - web_network
    labels:
      - "homepage.group=Sistema"
      - "homepage.name=Traefik"
      - "homepage.icon=traefik.png"
      - "homepage.href=http://localhost:8080/dashboard/"
      - "homepage.description=Reverse proxy e routing"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.localhost
      - HOMEPAGE_VAR_GREETING=Bentornato
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`homepage.localhost`)"
      - "traefik.http.routers.homepage.entrypoints=web"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

  it-tools:
    build: ./it-tools-it
    image: it-tools-it:local
    container_name: it_tools
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`tools.localhost`)"
      - "traefik.http.routers.it-tools.entrypoints=web"
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"
      - "homepage.group=Strumenti"
      - "homepage.name=IT-Tools"
      - "homepage.icon=it-tools.png"
      - "homepage.href=http://tools.localhost/"
      - "homepage.description=Utility per sviluppatori"

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`draw.localhost`)"
      - "traefik.http.routers.excalidraw.entrypoints=web"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
      - "homepage.group=Strumenti"
      - "homepage.name=Excalidraw"
      - "homepage.icon=excalidraw.png"
      - "homepage.href=http://draw.localhost/"
      - "homepage.description=Lavagna e diagrammi a mano libera"

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest-ultra-lite
    container_name: stirling-pdf
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling-pdf.rule=Host(`pdf.localhost`)"
      - "traefik.http.routers.stirling-pdf.entrypoints=web"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
      - "homepage.group=Strumenti"
      - "homepage.name=Stirling PDF"
      - "homepage.icon=mdi-file-pdf-box"
      - "homepage.href=http://pdf.localhost/"
      - "homepage.description=Unisci, dividi, comprimi PDF"

  # ------------------------------------------------------------------
  # Sviluppo / automazione / personale / sistema
  # I segreti stanno in .env (generato da ./setup.sh, mai nel repo).
  # ------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mail.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "homepage.group=Sviluppo"
      - "homepage.name=Mailpit"
      - "homepage.icon=mailpit.png"
      - "homepage.href=http://mail.localhost/"
      - "homepage.description=Casella email di test"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.rule=Host(`logs.localhost`)"
      - "traefik.http.routers.dozzle.entrypoints=web"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "homepage.group=Sistema"
      - "homepage.name=Dozzle"
      - "homepage.icon=dozzle.png"
      - "homepage.href=http://logs.localhost/"
      - "homepage.description=Log container live"

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    environment:
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=git.localhost
      - GITEA__server__ROOT_URL=http://git.localhost/
      - GITEA__server__SSH_DOMAIN=git.localhost
      - GITEA__server__SSH_PORT=2222
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__actions__ENABLED=true
      - GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION=true
      - GITEA__service__ENABLE_REVERSE_PROXY_AUTHENTICATION_API=true
      - GITEA__security__REVERSE_PROXY_AUTHENTICATION_USER=X-WEBAUTH-USER
      - GITEA__security__REVERSE_PROXY_TRUSTED_PROXIES=*
    volumes:
      - gitea_data:/data
    ports:
      - "127.0.0.1:2222:22"
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.localhost`)"
      - "traefik.http.routers.gitea.entrypoints=web"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.gitea-auth.headers.customrequestheaders.X-WEBAUTH-USER=dev"
      - "traefik.http.routers.gitea.middlewares=gitea-auth"
      - "homepage.group=Sviluppo"
      - "homepage.name=Gitea"
      - "homepage.icon=gitea.png"
      - "homepage.href=http://git.localhost/"
      - "homepage.description=Git locale"

  gitea-runner:
    image: gitea/act_runner:latest
    profiles: [provision]
    container_name: gitea_runner
    restart: unless-stopped
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=local-runner
    volumes:
      - gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web_network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.localhost
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://n8n.localhost/
      - GENERIC_TIMEZONE=Europe/Rome
      - TZ=Europe/Rome
      - N8N_USER_MANAGEMENT_JWT_DURATION_HOURS=8760
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.localhost`)"
      - "traefik.http.routers.n8n.entrypoints=web"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "homepage.group=Sviluppo"
      - "homepage.name=n8n"
      - "homepage.icon=n8n.png"
      - "homepage.href=http://n8n.localhost/"
      - "homepage.description=Automazioni e webhook"

  verdaccio:
    image: verdaccio/verdaccio:6
    container_name: verdaccio
    restart: unless-stopped
    volumes:
      - verdaccio_data:/verdaccio/storage
    ports:
      - "127.0.0.1:4873:4873"
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.verdaccio.rule=Host(`verdaccio.localhost`)"
      - "traefik.http.routers.verdaccio.entrypoints=web"
      - "traefik.http.services.verdaccio.loadbalancer.server.port=4873"
      - "homepage.group=Sviluppo"
      - "homepage.name=Verdaccio"
      - "homepage.icon=verdaccio.png"
      - "homepage.href=http://verdaccio.localhost/"
      - "homepage.description=Cache npm locale"

  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=http://minio.localhost
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.routers.minio-s3.rule=Host(`s3.localhost`)"
      - "traefik.http.routers.minio-s3.entrypoints=web"
      - "traefik.http.routers.minio-s3.service=minio-s3"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"
      - "homepage.group=Sviluppo"
      - "homepage.name=MinIO"
      - "homepage.icon=minio.png"
      - "homepage.href=http://minio.localhost/"
      - "homepage.description=Storage S3 locale (api: s3.localhost)"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=http://vault.localhost
      - SIGNUPS_ALLOWED=true
    volumes:
      - vaultwarden_data:/data
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.localhost`)"
      - "traefik.http.routers.vaultwarden.entrypoints=web"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "homepage.group=Personale"
      - "homepage.name=Vaultwarden"
      - "homepage.icon=vaultwarden.png"
      - "homepage.href=http://vault.localhost/"
      - "homepage.description=Password manager"

  linkding:
    image: sissbruecker/linkding:latest
    container_name: linkding
    restart: unless-stopped
    environment:
      - LD_SUPERUSER_NAME=dev
      - LD_SUPERUSER_PASSWORD=${LINKDING_PASSWORD}
      - LD_ENABLE_AUTH_PROXY=True
      - LD_AUTH_PROXY_USERNAME_HEADER=HTTP_REMOTE_USER
    volumes:
      - linkding_data:/etc/linkding/data
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.linkding.rule=Host(`links.localhost`)"
      - "traefik.http.routers.linkding.entrypoints=web"
      - "traefik.http.services.linkding.loadbalancer.server.port=9090"
      - "traefik.http.middlewares.linkding-auth.headers.customrequestheaders.Remote-User=dev"
      - "traefik.http.routers.linkding.middlewares=linkding-auth"
      - "homepage.group=Personale"
      - "homepage.name=Linkding"
      - "homepage.icon=linkding.png"
      - "homepage.href=http://links.localhost/"
      - "homepage.description=Segnalibri"

  memos:
    image: ghcr.io/usememos/memos:stable
    container_name: memos
    restart: unless-stopped
    volumes:
      - memos_data:/var/opt/memos
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memos.rule=Host(`memos.localhost`)"
      - "traefik.http.routers.memos.entrypoints=web"
      - "traefik.http.services.memos.loadbalancer.server.port=5230"
      - "homepage.group=Personale"
      - "homepage.name=Memos"
      - "homepage.icon=memos.png"
      - "homepage.href=http://memos.localhost/"
      - "homepage.description=Appunti rapidi"

  convertx:
    image: ghcr.io/c4illin/convertx:latest
    container_name: convertx
    restart: unless-stopped
    environment:
      - HTTP_ALLOWED=true
      - ALLOW_UNAUTHENTICATED=true
      - JWT_SECRET=${CONVERTX_JWT}
    volumes:
      - convertx_data:/app/data
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.convertx.rule=Host(`convert.localhost`)"
      - "traefik.http.routers.convertx.entrypoints=web"
      - "traefik.http.services.convertx.loadbalancer.server.port=3000"
      - "homepage.group=Strumenti"
      - "homepage.name=ConvertX"
      - "homepage.icon=convertx.png"
      - "homepage.href=http://convert.localhost/"
      - "homepage.description=Converti file tra formati"

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      - AUTO_LOGIN=dev@docker.localhost
    volumes:
      - beszel_data:/beszel_data
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beszel.rule=Host(`beszel.localhost`)"
      - "traefik.http.routers.beszel.entrypoints=web"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"
      - "homepage.group=Sistema"
      - "homepage.name=Beszel"
      - "homepage.icon=beszel.png"
      - "homepage.href=http://beszel.localhost/"
      - "homepage.description=CPU e RAM per container"

  beszel-agent:
    image: henrygd/beszel-agent:latest
    profiles: [provision]
    container_name: beszel-agent
    restart: unless-stopped
    environment:
      - LISTEN=45876
      - KEY=${BESZEL_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web_network

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    command: serve
    environment:
      - TZ=Europe/Rome
      - DIUN_WATCH_SCHEDULE=0 9 * * 1
      - DIUN_WATCH_FIRSTCHECKNOTIF=false
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
      - DIUN_NOTIF_MAIL_HOST=mailpit
      - DIUN_NOTIF_MAIL_PORT=1025
      - DIUN_NOTIF_MAIL_FROM=diun@docker.localhost
      - DIUN_NOTIF_MAIL_TO=dev@docker.localhost
    volumes:
      - diun_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - web_network

  volume_backup:
    image: docker:27-cli
    container_name: volume_backup
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      - BACKUP_HOST_DIR=${BACKUP_HOST_DIR:-${PWD}/backups}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web_network

  # Pulsante ACCENDI/SPEGNI dei progetti nella homepage (vedi projects-ctl/app.py).
  # Agisce solo sui progetti compose elencati in PROJECTS.
  projects-ctl:
    build: ./projects-ctl
    image: projects-ctl:local
    container_name: projects_ctl
    restart: unless-stopped
    environment:
      - PROJECTS={}  # i tuoi progetti vanno in docker-compose.override.yml
      - ALLOWED_ORIGINS=http://homepage.localhost
      - STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - web_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.projects-ctl.rule=Host(`proj-ctl.localhost`)"
      - "traefik.http.routers.projects-ctl.entrypoints=web"
      - "traefik.http.services.projects-ctl.loadbalancer.server.port=8000"

networks:
  web_network:
    name: web_network
    external: true

volumes:
  gitea_data:
  gitea_runner_data:
  n8n_data:
  verdaccio_data:
  minio_data:
  vaultwarden_data:
  linkding_data:
  memos_data:
  beszel_data:
  diun_data:
  convertx_data:
